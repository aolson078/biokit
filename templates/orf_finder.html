{% extends "base.html" %}

{% block title %}ORF Finder{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="orf-panel p-4">
    <h2 class="mb-3">ORF Finder</h2>
    <p class="text-muted">Paste a DNA sequence to identify complete open reading frames across both strands.</p>
    <div class="mb-3">
      <label for="orf-sequence" class="form-label">DNA sequence</label>
      <textarea id="orf-sequence" class="form-control" rows="8" placeholder=">example
ATGGCC..."></textarea>
    </div>
    <div class="mb-3">
      <label for="orf-min-length" class="form-label">Minimum ORF length (nt)</label>
      <input id="orf-min-length" class="form-control" type="number" min="30" max="5000" value="90">
    </div>
    <button id="run-orf" class="btn btn-primary">Run ORF Finder</button>
    <p id="orf-status" class="mt-3 text-muted" aria-live="polite"></p>
  </div>
  <div id="orf-results" class="table-responsive mt-3"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='scripts/orf_finder.js') }}"></script>
{% endblock %}
